<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="作業、睡眠、読書に使えるアンビエント集中ミキサー。ホワイトノイズや自然音をブラウザで再生できます。">
  <meta name="theme-color" content="#070b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Focus Sound">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Focus Sound</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b10;
      --bg-soft: #0b1118;
      --surface: rgba(16, 25, 34, 0.92);
      --surface-strong: rgba(21, 34, 44, 0.96);
      --line: #263746;
      --line-soft: rgba(132, 163, 179, 0.18);
      --text: #edf5f7;
      --muted: #91a5ae;
      --quiet: #627781;
      --teal: #3ce0c3;
      --teal-deep: #128a83;
      --amber: #ffb44f;
      --rose: #ff6a7c;
      --green: #92dd8f;
      --blue: #73b5ff;
      --shadow: rgba(0, 0, 0, 0.42);
      --radius: 8px;
      --font: "SFMono-Regular", "Cascadia Mono", "Roboto Mono", "Noto Sans Mono CJK JP", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: var(--font);
      background:
        linear-gradient(180deg, rgba(8, 14, 20, 0.94), rgba(6, 9, 13, 1)),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 44px);
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 34px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line-soft);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 13px;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid rgba(60, 224, 195, 0.42);
      border-radius: var(--radius);
      color: var(--teal);
      background: linear-gradient(135deg, rgba(60, 224, 195, 0.13), rgba(255, 180, 79, 0.08));
      box-shadow: 0 12px 38px rgba(60, 224, 195, 0.08);
      font-size: 0.94rem;
      font-weight: 800;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(1.2rem, 2.4vw, 1.65rem);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .brand-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .master-control {
      display: grid;
      grid-template-columns: auto minmax(150px, 240px) 46px;
      align-items: center;
      gap: 12px;
      min-width: min(100%, 310px);
      padding: 12px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(13, 20, 28, 0.76);
    }

    .master-label {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
    }

    .percent {
      color: var(--teal);
      font-size: 0.78rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .range {
      width: 100%;
      height: 28px;
      margin: 0;
      cursor: pointer;
      appearance: none;
      background: transparent;
      --value: 50%;
    }

    .range:focus-visible {
      outline: 2px solid rgba(60, 224, 195, 0.72);
      outline-offset: 4px;
      border-radius: 999px;
    }

    .range::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--teal) 0 var(--value), rgba(124, 148, 158, 0.24) var(--value) 100%);
    }

    .range::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(124, 148, 158, 0.24);
    }

    .range::-moz-range-progress {
      height: 6px;
      border-radius: 999px;
      background: var(--teal);
    }

    .range::-webkit-slider-thumb {
      width: 18px;
      height: 18px;
      margin-top: -6px;
      appearance: none;
      border: 2px solid #0a1016;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 4px rgba(255, 180, 79, 0.16);
    }

    .range::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: 2px solid #0a1016;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 4px rgba(255, 180, 79, 0.16);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 390px);
      gap: 20px;
      padding-top: 20px;
    }

    .left-stack,
    .right-stack {
      display: grid;
      align-content: start;
      gap: 20px;
    }

    .stage {
      position: relative;
      min-height: 270px;
      overflow: hidden;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(10, 18, 24, 0.9), rgba(10, 15, 20, 0.82)),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.026) 0 1px, transparent 1px 38px);
      box-shadow: 0 22px 60px var(--shadow);
    }

    #visualizer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .stage-overlay {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 270px;
      align-content: space-between;
      padding: 18px;
      pointer-events: none;
    }

    .status-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      pointer-events: auto;
    }

    .status-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 6px 9px;
      border: 1px solid rgba(60, 224, 195, 0.28);
      border-radius: var(--radius);
      color: var(--teal);
      background: rgba(5, 10, 14, 0.52);
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-text {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .primary-button,
    .ghost-button,
    .timer-button,
    .preset-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 160ms ease, transform 160ms ease, background 160ms ease, color 160ms ease;
    }

    .primary-button {
      min-width: 116px;
      padding: 0 15px;
      border-color: rgba(255, 180, 79, 0.46);
      color: #120d06;
      background: var(--amber);
      font-weight: 800;
    }

    .primary-button:hover,
    .ghost-button:hover,
    .timer-button:hover,
    .preset-button:hover {
      transform: translateY(-1px);
    }

    .primary-button:focus-visible,
    .ghost-button:focus-visible,
    .timer-button:focus-visible,
    .preset-button:focus-visible,
    .sound-card:focus-visible {
      outline: 2px solid rgba(60, 224, 195, 0.74);
      outline-offset: 3px;
    }

    .pulse-line {
      display: grid;
      gap: 8px;
      align-self: end;
      max-width: 560px;
    }

    .pulse-title {
      font-size: clamp(1.35rem, 3.5vw, 2.45rem);
      line-height: 1.04;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .pulse-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .meter-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--quiet);
      box-shadow: 0 0 0 rgba(60, 224, 195, 0);
    }

    .meter-dot.is-live {
      background: var(--teal);
      animation: breathe 1.7s ease-in-out infinite;
    }

    @keyframes breathe {
      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(60, 224, 195, 0.24);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 0 9px rgba(60, 224, 195, 0);
        transform: scale(1.18);
      }
    }

    .section {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.22);
    }

    .section-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 0;
    }

    .section-title {
      font-size: 0.86rem;
      color: var(--text);
      text-transform: uppercase;
    }

    .section-kicker {
      color: var(--quiet);
      font-size: 0.72rem;
      text-transform: uppercase;
    }

    .sound-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 16px;
    }

    .sound-card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      min-height: 94px;
      padding: 13px;
      border: 1px solid rgba(132, 163, 179, 0.2);
      border-radius: var(--radius);
      color: var(--text);
      background: rgba(11, 18, 25, 0.74);
      cursor: pointer;
      text-align: left;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .sound-card:hover {
      transform: translateY(-2px);
      border-color: rgba(60, 224, 195, 0.34);
      background: rgba(16, 27, 36, 0.86);
    }

    .sound-card.is-active {
      border-color: rgba(60, 224, 195, 0.62);
      background: linear-gradient(135deg, rgba(24, 48, 52, 0.94), rgba(26, 34, 39, 0.94));
      box-shadow: 0 0 0 1px rgba(60, 224, 195, 0.18), 0 18px 48px rgba(60, 224, 195, 0.09);
    }

    .sound-card.is-active .sound-icon {
      border-color: rgba(255, 180, 79, 0.42);
      background: rgba(255, 180, 79, 0.12);
    }

    .sound-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(132, 163, 179, 0.2);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.03);
      font-size: 1.2rem;
    }

    .sound-copy {
      display: grid;
      min-width: 0;
      gap: 7px;
    }

    .sound-label {
      overflow-wrap: anywhere;
      font-size: 0.93rem;
      line-height: 1.25;
      font-weight: 800;
    }

    .sound-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    .mixer-list {
      display: grid;
      gap: 0;
      padding: 10px 16px 16px;
    }

    .empty-state {
      display: grid;
      min-height: 132px;
      place-items: center;
      border: 1px dashed rgba(132, 163, 179, 0.22);
      border-radius: var(--radius);
      color: var(--quiet);
      font-size: 0.88rem;
    }

    .mix-row {
      display: grid;
      grid-template-columns: minmax(110px, 150px) minmax(130px, 1fr) 46px 34px;
      align-items: center;
      gap: 11px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(132, 163, 179, 0.14);
    }

    .mix-row:last-child {
      border-bottom: 0;
    }

    .mix-name {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
      font-size: 0.84rem;
      font-weight: 800;
    }

    .mix-name span:last-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-button {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(132, 163, 179, 0.22);
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(8, 13, 18, 0.68);
      cursor: pointer;
      transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
    }

    .icon-button:hover {
      border-color: rgba(255, 106, 124, 0.42);
      color: var(--rose);
      background: rgba(255, 106, 124, 0.08);
    }

    .icon-button:focus-visible {
      outline: 2px solid rgba(255, 180, 79, 0.7);
      outline-offset: 3px;
    }

    .timer-face {
      display: grid;
      gap: 12px;
      padding: 16px;
    }

    .time-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 76px;
      padding: 14px;
      border: 1px solid rgba(255, 180, 79, 0.22);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(255, 180, 79, 0.1), rgba(60, 224, 195, 0.07));
    }

    .time-value {
      color: var(--amber);
      font-size: clamp(1.9rem, 5vw, 2.6rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
    }

    .timer-state {
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
    }

    .timer-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .timer-button,
    .ghost-button,
    .preset-button {
      padding: 0 12px;
      color: var(--text);
      background: rgba(8, 13, 18, 0.68);
    }

    .timer-button.is-primary {
      border-color: rgba(60, 224, 195, 0.42);
      color: var(--teal);
      background: rgba(60, 224, 195, 0.1);
      font-weight: 800;
    }

    .duration-grid,
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .duration-button {
      min-height: 36px;
      border: 1px solid rgba(132, 163, 179, 0.2);
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(8, 13, 18, 0.58);
      cursor: pointer;
    }

    .duration-button.is-active {
      border-color: rgba(255, 180, 79, 0.46);
      color: var(--amber);
      background: rgba(255, 180, 79, 0.08);
    }

    .custom-time {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
    }

    .number-input {
      width: 100%;
      min-height: 38px;
      padding: 0 10px;
      border: 1px solid rgba(132, 163, 179, 0.2);
      border-radius: var(--radius);
      color: var(--text);
      background: rgba(5, 9, 13, 0.64);
    }

    .number-input:focus-visible {
      outline: 2px solid rgba(60, 224, 195, 0.72);
      outline-offset: 2px;
    }

    .custom-time span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .preset-section {
      padding: 16px;
    }

    .preset-grid {
      margin-top: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .preset-button {
      min-height: 44px;
      justify-content: flex-start;
      color: var(--muted);
    }

    .preset-button strong {
      color: var(--text);
      font-size: 0.82rem;
    }

    .preset-button.is-active {
      border-color: rgba(60, 224, 195, 0.42);
      background: rgba(60, 224, 195, 0.09);
    }

    .save-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(132, 163, 179, 0.13);
    }

    .save-row .status-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .external-section {
      display: grid;
      gap: 12px;
      padding: 16px;
    }

    .template-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .template-button,
    .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      min-height: 38px;
      padding: 0 11px;
      border: 1px solid rgba(132, 163, 179, 0.2);
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(8, 13, 18, 0.58);
      cursor: pointer;
    }

    .template-button.is-active {
      border-color: rgba(60, 224, 195, 0.42);
      color: var(--teal);
      background: rgba(60, 224, 195, 0.09);
    }

    .field-stack {
      display: grid;
      gap: 9px;
    }

    .text-input {
      width: 100%;
      min-height: 38px;
      padding: 0 10px;
      border: 1px solid rgba(132, 163, 179, 0.2);
      border-radius: var(--radius);
      color: var(--text);
      background: rgba(5, 9, 13, 0.64);
    }

    .text-input:focus-visible {
      outline: 2px solid rgba(60, 224, 195, 0.72);
      outline-offset: 2px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      cursor: pointer;
    }

    .toggle-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--teal);
    }

    .external-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .file-button,
    .external-actions .ghost-button {
      justify-content: center;
      width: 100%;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .audio-debug {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      width: min(420px, calc(100vw - 24px));
      max-height: min(52vh, 420px);
      overflow: auto;
      padding: 12px;
      border: 1px solid rgba(255, 180, 79, 0.42);
      border-radius: var(--radius);
      color: var(--text);
      background: rgba(7, 11, 16, 0.94);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34);
      font-size: 0.72rem;
      line-height: 1.45;
    }

    .audio-debug strong {
      display: block;
      margin-bottom: 8px;
      color: var(--amber);
      font-size: 0.78rem;
    }

    .audio-debug pre {
      margin: 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    @media (max-width: 940px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .right-stack {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .app {
        width: min(100% - 24px, 680px);
        padding-top: 16px;
      }

      .topbar,
      .status-strip {
        align-items: stretch;
        flex-direction: column;
      }

      .master-control {
        grid-template-columns: auto minmax(0, 1fr) 46px;
        width: 100%;
      }

      .sound-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .right-stack {
        grid-template-columns: 1fr;
      }

      .mix-row {
        grid-template-columns: minmax(0, 1fr) 46px 34px;
      }

      .mix-row .range {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .pulse-title {
        max-width: 12ch;
      }
    }

    @media (max-width: 480px) {
      .stage-overlay {
        padding: 14px;
      }

      .sound-card {
        min-height: 84px;
      }

      .duration-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .preset-grid,
      .template-grid,
      .timer-controls,
      .external-actions,
      .save-row {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">FS</div>
        <div>
          <h1>Focus Sound</h1>
          <p class="brand-subtitle">アンビエント集中ミキサー</p>
        </div>
      </div>

      <label class="master-control" for="masterVolume">
        <span class="master-label">Master</span>
        <input class="range" id="masterVolume" type="range" min="0" max="100" value="65" aria-label="マスターボリューム">
        <span class="percent" id="masterPercent">65%</span>
      </label>
    </header>

    <main class="layout">
      <div class="left-stack">
        <section class="stage" aria-label="ビジュアライザー">
          <canvas id="visualizer"></canvas>
          <div class="stage-overlay">
            <div class="status-strip">
              <div class="status-line">
                <span class="status-chip" id="activeCount">0 layer</span>
                <span class="status-text" id="statusText">Ready</span>
              </div>
              <button class="primary-button" type="button" id="playAllButton" data-testid="play-all">
                <span id="playAllIcon" aria-hidden="true">▶</span>
                <span id="playAllLabel">再生</span>
              </button>
            </div>
            <div class="pulse-line">
              <h2 class="pulse-title">Deep work, low noise.</h2>
              <div class="pulse-meta">
                <span class="meter-dot" id="meterDot" aria-hidden="true"></span>
                <span id="nowPlaying">未再生</span>
              </div>
            </div>
          </div>
        </section>

        <section class="section" aria-labelledby="soundsTitle">
          <div class="section-header">
            <div>
              <p class="section-kicker">Sound catalog</p>
              <h2 class="section-title" id="soundsTitle">サウンド</h2>
            </div>
          </div>
          <div class="sound-grid" id="soundGrid"></div>
        </section>

        <section class="section" aria-labelledby="mixerTitle">
          <div class="section-header">
            <div>
              <p class="section-kicker">Active layers</p>
              <h2 class="section-title" id="mixerTitle">ミックス</h2>
            </div>
          </div>
          <div class="mixer-list" id="mixerList"></div>
        </section>
      </div>

      <aside class="right-stack">
        <section class="section" aria-labelledby="timerTitle">
          <div class="section-header">
            <div>
              <p class="section-kicker">Focus timer</p>
              <h2 class="section-title" id="timerTitle">タイマー</h2>
            </div>
          </div>
          <div class="timer-face">
            <div class="time-display">
              <div>
                <div class="time-value" id="timeValue">25:00</div>

              <span aria-hidden="true">⏱</span>

            <div class="timer-controls">
              <button class="timer-button is-primary" type="button" id="timerToggle">開始</button>
