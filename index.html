          <div class="section-header">
            <div>
              <p class="section-kicker">Mix presets</p>
              <h2 class="section-title" id="presetTitle">プリセット</h2>
            </div>
          </div>
          <div class="preset-section">
            <div class="preset-grid" id="presetGrid"></div>
            <div class="save-row">
              <span class="status-text" id="saveStatus">未保存</span>
              <button class="ghost-button" type="button" id="savePreset">保存</button>
            </div>
          </div>
        </section>

        <section class="section" aria-labelledby="externalTitle">
          <div class="section-header">
            <div>
              <p class="section-kicker">External audio</p>
              <h2 class="section-title" id="externalTitle">外部音源</h2>
            </div>
          </div>
          <div class="external-section">
            <div class="template-grid" id="externalTemplates" aria-label="外部音源タイプ"></div>
            <div class="field-stack">
              <label class="visually-hidden" for="externalName">名前</label>
              <input class="text-input" id="externalName" type="text" value="Jazz" maxlength="18" autocomplete="off">
              <label class="visually-hidden" for="externalUrl">URL</label>
              <input class="text-input" id="externalUrl" type="url" placeholder="https://...">
              <label class="toggle-row" for="externalLoop">
                <input id="externalLoop" type="checkbox">
                <span>Loop</span>
              </label>
              <div class="external-actions">
                <label class="file-button" for="externalFile">
                  <input class="visually-hidden" id="externalFile" type="file" accept="audio/*">
                  <span>File</span>
                </label>
                <button class="ghost-button" type="button" id="addExternalUrl">URL / Radio</button>
              </div>
              <span class="status-text" id="externalStatus">未追加</span>
            </div>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "focus-sound-state-v9";
      const FADE_SECONDS = 0.9;
      const SILENT_MEDIA_VOLUME = 0.005;
      const RADIO_BROWSER_SEARCH = "https://de1.api.radio-browser.info/json/stations/search";
      const MIXED_CONTENT_STATUS = "HTTPS音源のみ対応";
      const AUDIO_CONTROL_STATUS = "音量調整できる音源なし";
      const AUDIO_DEBUG = new URLSearchParams(window.location.search).get("debug") === "audio"
        || window.location.hash.includes("debug");

      function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      }

      const EXTERNAL_TEMPLATES = {
        cafe: {
          label: "Bossa Cafe",
          icon: "喫",
          tone: "Bossa",
          loop: true,
          buttonLabel: "Bossa Cafe",
          fixedUrl: "https://upload.wikimedia.org/wikipedia/commons/transcoded/6/6e/609562_migfus20_background-music.ogg/609562_migfus20_background-music.ogg.mp3",
          fixedLabel: "Bossa Cafe",
          fixedTone: "Bossa",
          radioQueries: [
            { name: "bossa nova" },
            { tag: "bossa nova" },
            { name: "bossanova" },
            { tag: "bossanova" }
          ]
        },
        birds: {
          label: "鳥の声",
          icon: "鳥",
          tone: "Nature",
          loop: true,
          buttonLabel: "鳥の声",
          fixedUrl: "https://upload.wikimedia.org/wikipedia/commons/transcoded/0/0e/Gentle_breeze_and_birds_singing.ogg/Gentle_breeze_and_birds_singing.ogg.mp3",
          fixedLabel: "鳥の声",
          fixedTone: "Nature",
          radioQueries: [
            { name: "bird" },
            { name: "nature" },
            { tag: "nature" }
          ]
        },
        crowd: {
          label: "人混み",
          icon: "群",
          tone: "Ambience",
          loop: true,
          buttonLabel: "人混み Ambience",
          fixedUrl: "https://upload.wikimedia.org/wikipedia/commons/transcoded/b/b5/Restaurant_ambience.ogg/Restaurant_ambience.ogg.mp3",
          fixedLabel: "人混み",
          fixedTone: "Ambience",
          radioQueries: [
            { name: "talk" },
            { tag: "talk" },
            { tag: "news" }
          ]
        },
        jazz: {
          label: "Jazz",
          icon: "JZ",
          tone: "Jazz",
          loop: true,
          buttonLabel: "Jazz",
          fixedUrl: "https://upload.wikimedia.org/wikipedia/commons/transcoded/0/03/Jazz_at_the_park.ogg/Jazz_at_the_park.ogg.mp3",
          fixedLabel: "Jazz",
          fixedTone: "Jazz",
          radioQueries: [
            { name: "jazz", tag: "jazz" },
            { tag: "jazz" }
          ]
        }
      };

      const SOUNDS = [
        {
          id: "rain",
          label: "雨",
          icon: "雨",
          category: "nature",
          tone: "Hiss",
          defaultVolume: 0.48,
          create: createRainNoise
        },
        {
          id: "wind",
          label: "風",
          icon: "風",
          category: "nature",
          tone: "Low",
          defaultVolume: 0.34,
          create: createWindNoise
        },
        {
          id: "waves",
          label: "波",
          icon: "波",
          category: "nature",
          tone: "Pulse",
          defaultVolume: 0.42,
          create: createWaveNoise
        },
        {
          id: "fire",
          label: "焚き火",
          icon: "火",
          category: "nature",
          tone: "Crackle",
          defaultVolume: 0.38,
          create: createFireNoise
        },
        {
          id: "white",
          label: "ホワイト",
          icon: "W",
          category: "noise",
          tone: "Bright",
          defaultVolume: 0.3,
          create: (ctx) => singleSourceGraph(createWhiteNoise(ctx))
        },
        {
          id: "babywhite",
          label: "ねんね白音",
          icon: "睡",
          category: "noise",
          tone: "Soft",
          defaultVolume: 0.28,
          create: createBabyWhiteNoise
        },
        {
          id: "pink",
          label: "ピンク",
          icon: "P",
          category: "noise",
          tone: "Balanced",
          defaultVolume: 0.36,
          create: (ctx) => singleSourceGraph(createPinkNoise(ctx))
        },
        {
          id: "brown",
          label: "ブラウン",
          icon: "B",
          category: "noise",
          tone: "Deep",
          defaultVolume: 0.32,
          create: (ctx) => singleSourceGraph(createBrownNoise(ctx))
        }
      ];

      const PRESETS = {
        deep: {
          label: "深集中",
          icon: "◆",
          mix: { pink: 0.42, rain: 0.44, wind: 0.18 }
        },
        night: {
          label: "夜作業",
          icon: "◐",
          mix: { brown: 0.38, waves: 0.34, wind: 0.2 }
        },
        desk: {
          label: "雨デスク",
          icon: "▦",
          mix: { white: 0.24, rain: 0.54 }
        },
        baby: {
          label: "ねんね",
          icon: "睡",
          mix: { babywhite: 0.34, brown: 0.1 }
        },
        warm: {
          label: "焚き火",
          icon: "△",
          mix: { fire: 0.48, brown: 0.22 }
        }
      };

      const soundById = new Map(SOUNDS.map((sound) => [sound.id, sound]));
      const bufferCache = new Map();
      const runtime = new Map();

      let ctx = null;
      let masterGain = null;
      let analyser = null;
      let frequencyData = null;
      let canvasContext = null;
      let rafId = 0;
      let activePreset = null;
      let selectedExternalTemplate = "jazz";
      let audioDebugEl = null;
      let audioDebugTimerId = 0;
      const audioDebugEvents = [];

      const state = loadState();
      restoreExternalSounds();
      const timer = {
        duration: state.timerMinutes * 60,
        remaining: state.timerMinutes * 60,
        running: false,
        endAt: 0,
        intervalId: 0
      };

      const el = {
        activeCount: document.getElementById("activeCount"),
        addExternalUrl: document.getElementById("addExternalUrl"),
        customMinutes: document.getElementById("customMinutes"),
        durationGrid: document.getElementById("durationGrid"),
        externalFile: document.getElementById("externalFile"),
        externalLoop: document.getElementById("externalLoop"),
        externalName: document.getElementById("externalName"),
        externalStatus: document.getElementById("externalStatus"),
        externalTemplates: document.getElementById("externalTemplates"),
        externalUrl: document.getElementById("externalUrl"),
        masterPercent: document.getElementById("masterPercent"),
        masterVolume: document.getElementById("masterVolume"),
        meterDot: document.getElementById("meterDot"),
        mixerList: document.getElementById("mixerList"),
        nowPlaying: document.getElementById("nowPlaying"),
        playAllButton: document.getElementById("playAllButton"),
        playAllIcon: document.getElementById("playAllIcon"),
        playAllLabel: document.getElementById("playAllLabel"),
        presetGrid: document.getElementById("presetGrid"),
        savePreset: document.getElementById("savePreset"),
        saveStatus: document.getElementById("saveStatus"),
        soundGrid: document.getElementById("soundGrid"),
        statusText: document.getElementById("statusText"),
        timerReset: document.getElementById("timerReset"),
        timerState: document.getElementById("timerState"),
        timerToggle: document.getElementById("timerToggle"),
        timeValue: document.getElementById("timeValue"),
        visualizer: document.getElementById("visualizer")
      };

      init();

      function init() {
        canvasContext = el.visualizer.getContext("2d");
        applyLaunchIntent();
        registerServiceWorker();
        initAudioDebug();
        renderExternalTemplates();
        renderSoundGrid();
        renderMixer();
        renderPresetGrid();
        syncMasterUi();
        syncTimerUi();
        bindEvents();
        resizeVisualizer();
        drawVisualizer();
      }

      function bindEvents() {
        window.addEventListener("resize", resizeVisualizer);

        document.addEventListener("pointerdown", () => {
          if (!ctx) {
            void ensureAudio();
          } else if (ctx.state === "suspended") {
            void ctx.resume();
          }
        }, { passive: true });

        document.addEventListener("keydown", (event) => {
          const target = event.target;
          const tag = target && target.tagName ? target.tagName.toLowerCase() : "";
          if (event.code === "Space" && tag !== "input" && tag !== "textarea" && tag !== "button") {
            event.preventDefault();
            void toggleGlobalPlayback();
          }
        });

        el.soundGrid.addEventListener("click", (event) => {
          const card = event.target.closest("[data-sound-id]");
          if (!card) return;
          void toggleSound(card.dataset.soundId);
        });

        el.mixerList.addEventListener("input", (event) => {
          const input = event.target.closest("[data-volume-id]");
          if (!input) return;
          const id = input.dataset.volumeId;
          if (ctx && ctx.state === "suspended") {
            ctx.resume().then(() => {
              runtime.forEach((entry) => {
                const m = entry.graph && entry.graph.media;
                if (!m || m.paused) return;
                const t = m.currentTime;
                m.pause();
                m.currentTime = t;
                void m.play();
              });
            });
          }
          setSoundVolume(id, Number(input.value) / 100);
        });

        el.mixerList.addEventListener("click", (event) => {
          const button = event.target.closest("[data-stop-id]");
          if (!button) return;
          stopSound(button.dataset.stopId, { remember: true });
        });

        el.masterVolume.addEventListener("input", () => {
          state.masterVolume = Number(el.masterVolume.value) / 100;
          syncMasterUi();
          persistState();
        });

        el.playAllButton.addEventListener("click", () => {
          void toggleGlobalPlayback();
        });

        el.presetGrid.addEventListener("click", (event) => {
          const button = event.target.closest("[data-preset-id]");
          if (!button) return;
          void applyPreset(button.dataset.presetId);
        });

        el.savePreset.addEventListener("click", saveCustomPreset);

        el.timerToggle.addEventListener("click", toggleTimer);
        el.timerReset.addEventListener("click", resetTimer);

        el.durationGrid.addEventListener("click", (event) => {
          const button = event.target.closest("[data-minutes]");
          if (!button) return;
          setTimerMinutes(Number(button.dataset.minutes));
        });

        el.customMinutes.addEventListener("change", () => {
          const minutes = clamp(Number(el.customMinutes.value) || state.timerMinutes, 1, 180);
          setTimerMinutes(minutes);
        });

        el.externalTemplates.addEventListener("click", (event) => {
          const button = event.target.closest("[data-external-template]");
          if (!button) return;
          void addExternalRadioTemplate(button.dataset.externalTemplate);
        });

        el.addExternalUrl.addEventListener("click", () => {
          void addExternalUrlSound();
        });

        el.externalFile.addEventListener("change", () => {
          addExternalFileSound();
        });
      }

      function loadState() {
        const defaults = {
          masterVolume: 0.65,
          timerMinutes: 25,
          lastMix: ["rain", "pink"],
          volumes: Object.fromEntries(SOUNDS.map((sound) => [sound.id, sound.defaultVolume])),
          customPreset: null,
          externalSounds: []
        };

        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (!stored || typeof stored !== "object") return defaults;
          return {
            ...defaults,
            ...stored,
            volumes: {
              ...defaults.volumes,
              ...(stored.volumes || {})
            },
            lastMix: Array.isArray(stored.lastMix) && stored.lastMix.length ? stored.lastMix : defaults.lastMix,
            externalSounds: Array.isArray(stored.externalSounds) ? stored.externalSounds : []
          };
        } catch {
          return defaults;
        }
      }

      function restoreExternalSounds() {
        state.externalSounds = state.externalSounds
          .filter((sound) => sound && (sound.sourceType === "url" || sound.sourceType === "buffer") && isPlayableExternalUrl(sound.url))
          .map((sound) => ({
            id: sound.id || `ext-url-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`,
            label: sound.label || "外部音源",
            icon: sound.icon || "音",
            tone: sound.tone || (sound.loop ? "URL loop" : "Radio"),
            templateKey: sound.templateKey || inferExternalTemplateKey(sound),
            sourceType: sound.sourceType || "url",
            url: sound.url,
            loop: Boolean(sound.loop),
            defaultVolume: clamp(Number(sound.defaultVolume) || 0.45, 0, 1)
          }));

        state.externalSounds.forEach(registerExternalSound);
      }

      function persistState() {
        const payload = {
          masterVolume: state.masterVolume,
          timerMinutes: state.timerMinutes,
          lastMix: state.lastMix,
          volumes: state.volumes,
          customPreset: state.customPreset,
          externalSounds: state.externalSounds
        };
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch {
          setStatus("保存できません");
        }
      }

      function applyLaunchIntent() {
        if (window.location.hash !== "#baby") return;
        state.lastMix = ["babywhite"];
        state.volumes.babywhite = 0.34;
        activePreset = "baby";
        setStatus("ねんね白音");
      }

      function registerServiceWorker() {
        if (!("serviceWorker" in navigator)) return;
        const isSecure = window.location.protocol === "https:" || window.location.hostname === "localhost";
        if (!isSecure) return;
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {
            // PWA support is optional; audio should keep working without it.
          });
        });
      }

      function selectExternalTemplate(key) {
        if (!EXTERNAL_TEMPLATES[key]) return;
        selectedExternalTemplate = key;
        const template = EXTERNAL_TEMPLATES[key];
        el.externalName.value = template.label;
        el.externalLoop.checked = template.loop;
        renderExternalTemplates();
      }

      async function addExternalRadioTemplate(key) {
        selectExternalTemplate(key);
        void ensureAudio();
        await addRadioSound(key);
      }

      async function addRadioSound(key) {
        const template = EXTERNAL_TEMPLATES[key] || EXTERNAL_TEMPLATES.jazz;

        // iOS: always use fixed file for full volume control
        if (isIOS() && template.fixedUrl) {
          await addFixedExternalSound(key, template);
          return;
        }

        // Non-iOS: radio only
        const station = await findRadioStation(key);
        if (!station) {
          setExternalStatus("候補なし");
          return;
        }

        const duplicate = state.externalSounds.find((item) => item.url === station.url);
        if (duplicate && soundById.has(duplicate.id)) {
          setExternalStatus(`${duplicate.label} 再生`);
          await startSound(duplicate.id);
          return;
        }

        const sound = buildExternalSound({
          sourceType: "url",
          url: station.url,
          label: template.outputLabel || `${template.label} Radio`,
          loop: false,
          tone: template.tone || "Live",
          templateKey: key,
          persist: true
        });

        registerExternalSound(sound);
        state.externalSounds.push(toStoredExternalSound(sound));
        state.volumes[sound.id] = sound.defaultVolume;
        state.lastMix = [sound.id];
        persistState();
        renderSoundGrid();
        renderMixer();
        setExternalStatus(`${sound.label} 追加`);
        await startSound(sound.id);
      }

      async function addFixedExternalSound(key, template) {
        const duplicate = state.externalSounds.find((item) => item.url === template.fixedUrl);
        if (duplicate && soundById.has(duplicate.id)) {
          setExternalStatus(`${duplicate.label} 再生`);
          await startSound(duplicate.id);
          return;
        }

        setExternalStatus("読み込み中");
        const sound = buildExternalSound({
          sourceType: "buffer",
          url: template.fixedUrl,
          label: template.fixedLabel || template.label,
          loop: true,
          tone: template.fixedTone || "Ambient",
          templateKey: key,
          persist: true
        });

        registerExternalSound(sound);
        state.externalSounds.push(toStoredExternalSound(sound));
        state.volumes[sound.id] = sound.defaultVolume;
        state.lastMix = [sound.id];
        persistState();
        renderSoundGrid();
        renderMixer();
        setExternalStatus(`${sound.label} 追加`);
        await startSound(sound.id);
      }

      async function addExternalUrlSound() {
        void ensureAudio();
        let url = el.externalUrl.value.trim();
        let label = el.externalName.value.trim();
        let loop = el.externalLoop.checked;

        if (!url) {
          await addRadioSound(selectedExternalTemplate);
          return;
        }

        try {
          new URL(url);
        } catch {
          setExternalStatus("URLエラー");
          return;
        }

        if (!isPlayableExternalUrl(url)) {
          setExternalStatus(MIXED_CONTENT_STATUS);
          return;
        }

        setExternalStatus("音量対応確認中");
        if (!await isExternalAudioControllable(url)) {
          setExternalStatus(AUDIO_CONTROL_STATUS);
          return;
        }

        const duplicate = state.externalSounds.find((item) => item.url === url);
        if (duplicate && soundById.has(duplicate.id)) {
          setExternalStatus(`${duplicate.label} 再生`);
          await startSound(duplicate.id);
          return;
        }

        const sound = buildExternalSound({
          sourceType: "url",
          url,
          label,
          loop,
          tone: loop ? "URL loop" : "Live",
          templateKey: selectedExternalTemplate,
          persist: true
        });

        registerExternalSound(sound);
        state.externalSounds.push(toStoredExternalSound(sound));
        state.volumes[sound.id] = sound.defaultVolume;
        state.lastMix = [sound.id];
        persistState();
        renderSoundGrid();
        renderMixer();
        setExternalStatus(`${sound.label} 追加`);
        el.externalUrl.value = "";
        await startSound(sound.id);
      }

      function addExternalFileSound() {
        const file = el.externalFile.files && el.externalFile.files[0];
        if (!file) return;

        const objectUrl = URL.createObjectURL(file);
        const sound = buildExternalSound({
          sourceType: "file",
          url: objectUrl,
          label: el.externalName.value.trim() || file.name.replace(/\.[^.]+$/, ""),
          loop: el.externalLoop.checked,
          templateKey: selectedExternalTemplate,
          persist: false
        });

        sound.objectUrl = objectUrl;
        registerExternalSound(sound);
        state.volumes[sound.id] = sound.defaultVolume;
        state.lastMix = [sound.id];
        renderSoundGrid();
        renderMixer();
        setExternalStatus(`${sound.label} 追加`);
        el.externalFile.value = "";
      }

      async function findRadioStation(templateKey) {
        const template = EXTERNAL_TEMPLATES[templateKey] || EXTERNAL_TEMPLATES.jazz;
        setExternalStatus("検索中");

        try {
          const queries = template.radioQueries && template.radioQueries.length
            ? template.radioQueries
            : [{ tag: "jazz" }];
          const stations = [];
          for (const query of queries) {
            stations.push(...await searchRadioStations(query));
          }
          const seen = new Set();
          const candidates = stations.filter((item) => {
            const url = item.url_resolved || item.url;
            const codec = String(item.codec || "").toLowerCase();
            const key = `${item.stationuuid || ""}:${url}`;
            if (seen.has(key)) return false;
            seen.add(key);
            return item.lastcheckok === 1
              && isPlayableExternalUrl(url)
              && !item.hls
              && ["mp3", "aac", "ogg"].some((name) => codec.includes(name) || url.toLowerCase().includes(name));
          });

          for (const [index, station] of candidates.slice(0, 10).entries()) {
            setExternalStatus(`音量対応確認中 ${index + 1}/${Math.min(candidates.length, 10)}`);
            const url = station.url_resolved || station.url;
            if (await isExternalAudioControllable(url)) {
              return {
                name: station.name,
                url
              };
            }
          }

          return null;
        } catch {
          return null;
        }
      }

      async function isExternalAudioControllable(value) {
        const url = String(value || "").trim();
        if (!isPlayableExternalUrl(url)) return false;
        if (url.startsWith("blob:")) return true;

        const controller = new AbortController();
        const timerId = window.setTimeout(() => controller.abort(), 4500);
        try {
          const response = await fetch(url, {
            method: "GET",
            mode: "cors",
            cache: "no-store",
            credentials: "omit",
            signal: controller.signal
          });
          debugAudio("cors probe", {
            url,
            status: response.status,
            type: response.type,
            ok: response.ok
          });
          if (response.body && typeof response.body.cancel === "function") {
            response.body.cancel().catch(() => {});
          }
          return response.ok || response.status === 206;
        } catch (error) {
          debugAudio("cors probe failed", {
            url,
            name: error && error.name ? error.name : "Error"
          });
          return false;
        } finally {
          clearTimeout(timerId);
          controller.abort();
        }
      }

      async function searchRadioStations(query) {
        const params = new URLSearchParams({
          hidebroken: "true",
          order: "votes",
          reverse: "true",
          limit: "24"
        });

        if (query.name) {
          params.set("name", query.name);
        }
        if (query.tag) {
          params.set("tag", query.tag);
        }

        const response = await fetch(`${RADIO_BROWSER_SEARCH}?${params.toString()}`, {
          headers: { Accept: "application/json" }
        });
        if (!response.ok) throw new Error("radio search failed");
        return response.json();
      }

      function buildExternalSound(options) {
        const template = EXTERNAL_TEMPLATES[selectedExternalTemplate] || EXTERNAL_TEMPLATES.jazz;
        const id = options.id || `ext-${options.sourceType}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
        const label = (options.label || template.label).slice(0, 18);
        return {
          id,
          label,
          icon: template.icon,
          category: "external",
          tone: options.tone || (options.sourceType === "url" ? (options.loop ? "URL loop" : template.tone || "Radio") : "File"),
          defaultVolume: 0.45,
          isExternal: true,
          templateKey: options.templateKey || selectedExternalTemplate,
          sourceType: options.sourceType,
          url: options.url,
          loop: Boolean(options.loop),
          create: options.sourceType === "buffer"
            ? (audio) => createFetchAudioGraph(audio, options.url, Boolean(options.loop))
            : (audio) => createExternalMediaGraph(audio, options.url, Boolean(options.loop))
        };
      }

      function isPlayableExternalUrl(value) {
        try {
          const url = new URL(String(value || "").trim(), window.location.href);
          if (url.protocol === "https:" || url.protocol === "blob:") return true;
          return false;
        } catch {
          return false;
        }
      }

      function registerExternalSound(sound) {
        if (!sound || !sound.url) return;
        const existing = soundById.get(sound.id);
        if (existing) return;
        const createFn = sound.sourceType === "buffer"
          ? (audio) => createFetchAudioGraph(audio, sound.url, Boolean(sound.loop))
          : (audio) => createExternalMediaGraph(audio, sound.url, Boolean(sound.loop));
        const hydrated = {
          ...sound,
          create: createFn
        };
        SOUNDS.push(hydrated);
        soundById.set(hydrated.id, hydrated);
        if (state.volumes[hydrated.id] === undefined) {
          state.volumes[hydrated.id] = hydrated.defaultVolume;
        }
      }

      function toStoredExternalSound(sound) {
        return {
          id: sound.id,
          label: sound.label,
          icon: sound.icon,
          tone: sound.tone,
          templateKey: sound.templateKey || inferExternalTemplateKey(sound),
          sourceType: sound.sourceType || "url",
          url: sound.url,
          loop: sound.loop,
          defaultVolume: sound.defaultVolume
        };
      }

      function inferExternalTemplateKey(sound) {
        const label = `${sound.label || ""} ${sound.tone || ""}`.toLowerCase();
        const url = String(sound.url || "");
        if (url === EXTERNAL_TEMPLATES.crowd.fixedUrl || label.includes("人混み") || label.includes("crowd")) {
          return "crowd";
        }
        if (label.includes("bossa") || label.includes("cafe") || label.includes("カフェ")) {
          return "cafe";
        }
        if (label.includes("鳥") || label.includes("bird") || label.includes("nature")) {
          return "birds";
        }
        if (label.includes("jazz")) {
          return "jazz";
        }
        return selectedExternalTemplate;
      }

      async function ensureAudio() {
        if (!ctx) {
          const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
          ctx = new AudioContextCtor();
          masterGain = ctx.createGain();
          analyser = ctx.createAnalyser();
          analyser.fftSize = 512;
          analyser.smoothingTimeConstant = 0.86;
          frequencyData = new Uint8Array(analyser.frequencyBinCount);
          masterGain.connect(analyser);
          analyser.connect(ctx.destination);
          applyMasterGain(true);
        }

        if (ctx.state === "suspended") {
          await ctx.resume();
        }
        return ctx;
      }

      function applyMasterGain(immediate = false) {
        if (!masterGain || !ctx) return;
        const now = ctx.currentTime;
        const value = clamp(state.masterVolume, 0, 1);
        masterGain.gain.cancelScheduledValues(now);
        if (immediate) {
          masterGain.gain.setValueAtTime(value, now);
        } else {
          masterGain.gain.linearRampToValueAtTime(value, now + 0.08);
        }
      }

      async function toggleSound(id) {
        if (isSoundActive(id)) {
          stopSound(id, { remember: true });
          return;
        }
        await startSound(id);
      }

      async function startSound(id) {
        const sound = soundById.get(id);
        if (!sound) return;

        const audio = await ensureAudio();
        const existing = runtime.get(id);
        if (existing) {
          cleanupEntry(existing);
        }

        const graph = await sound.create(audio);
        const gain = audio.createGain();
        gain.gain.setValueAtTime(0.0001, audio.currentTime);
        if (graph.output) {
          graph.output.connect(gain);
          gain.connect(masterGain);
        }

        const entry = {
          id,
          graph,
          gain,
          stopping: false,
          stopTimerId: 0
        };

        runtime.set(id, entry);
        setEntryVolume(entry, 0.0001, true);

        try {
          await startGraph(graph, audio.currentTime);
        } catch {
          debugAudio("start failed", { id, label: sound.label });
          cleanupEntry(entry);
          setStatus("再生できません");
          renderSoundGrid();
          renderMixer();
          syncPlaybackUi();
          return;
        }

        const targetVolume = clamp(state.volumes[id] ?? sound.defaultVolume, 0, 1);
        fadeEntryVolume(entry, 0.0001, targetVolume, FADE_SECONDS);

        activePreset = null;
        updateLastMixFromActive();
        persistState();
        renderSoundGrid();
        renderMixer();
        renderExternalTemplates();
        syncPlaybackUi();
      }

      function stopSound(id, options = {}) {
        const { remember = true } = options;
        const entry = runtime.get(id);
        if (!entry || !ctx) return;

        const activeBefore = getActiveIds();
        entry.stopping = true;
        clearTimeout(entry.stopTimerId);

        const current = entry.graph.direct ? (entry.currentVolume ?? 0.0001) : entry.gain.gain.value;
        fadeEntryVolume(entry, Math.max(current, 0.0001), 0.0001, FADE_SECONDS);

        entry.stopTimerId = window.setTimeout(() => {
          cleanupEntry(entry);
          renderSoundGrid();
          renderMixer();
          renderExternalTemplates();
          syncPlaybackUi();
        }, (FADE_SECONDS * 1000) + 120);

        if (remember) {
          const remaining = activeBefore.filter((activeId) => activeId !== id);
          if (remaining.length) {
            state.lastMix = remaining;
          } else if (activeBefore.length) {
            state.lastMix = activeBefore;
          }
          persistState();
        }

        activePreset = null;
        renderSoundGrid();
        renderMixer();
        renderExternalTemplates();
        syncPlaybackUi();
      }

      function stopAll(options = {}) {
        const { remember = true } = options;
        const activeIds = getActiveIds();
        if (remember && activeIds.length) {
          state.lastMix = activeIds;
          persistState();
        }
        activeIds.forEach((id) => stopSound(id, { remember: false }));
        activePreset = null;
        renderExternalTemplates();
        syncPlaybackUi();
      }

      async function toggleGlobalPlayback() {
        if (getActiveIds().length) {
          stopAll({ remember: true });
          setStatus("停止しました");
          return;
        }

        const nextMix = normalizeMixIds(state.lastMix);
        for (const id of nextMix) {
          await startSound(id);
        }
        setStatus("再生中");
      }

      async function applyPreset(key) {
        const preset = key === "custom" ? state.customPreset : PRESETS[key];
        if (!preset || !preset.mix) return;

        const mixIds = Object.keys(preset.mix).filter((id) => soundById.has(id));
        if (!mixIds.length) return;

        stopAll({ remember: false });

        for (const id of mixIds) {
          state.volumes[id] = clamp(preset.mix[id], 0, 1);
        }
        state.lastMix = mixIds;
        activePreset = key;
        persistState();

        for (const id of mixIds) {
          await startSound(id);
        }

        activePreset = key;
        renderPresetGrid();
        renderSoundGrid();
        renderMixer();
        renderExternalTemplates();
        syncPlaybackUi();
        setStatus(preset.label);
      }

      function saveCustomPreset() {
        const activeIds = getActiveIds();
        if (!activeIds.length) {
          setSaveStatus("保存するミックスなし");
          return;
        }

        state.customPreset = {
          label: "Custom",
          icon: "◇",
          mix: Object.fromEntries(activeIds.map((id) => [id, state.volumes[id]]))
        };
        state.lastMix = activeIds;
        persistState();
        renderPresetGrid();
        setSaveStatus("保存済み");
      }

      async function startGraph(graph, startTime) {
        for (const source of graph.sources) {
          try {
            if (typeof source.start === "function") {
              source.start(startTime);
            }
          } catch {
            if (typeof source.start === "function") {
              source.start();
            }
          }
        }
        if (typeof graph.start === "function") {
          await graph.start();
        }
      }

      function cleanupEntry(entry) {
        clearTimeout(entry.stopTimerId);
        cancelAnimationFrame(entry.fadeFrameId);
        if (typeof entry.graph.stop === "function") {
          entry.graph.stop();
        }
        for (const source of entry.graph.sources) {
          try {
            if (typeof source.stop === "function") {
              source.stop();
            }
          } catch {
            // Already stopped or never started.
          }
          safeDisconnect(source);
        }
        for (const node of entry.graph.nodes) {
          safeDisconnect(node);
        }
        safeDisconnect(entry.gain);
        runtime.delete(entry.id);
      }

      function fadeEntryVolume(entry, from, to, seconds) {
        cancelAnimationFrame(entry.fadeFrameId);
        if (entry.graph.direct) {
          const startedAt = performance.now();
          const duration = Math.max(1, seconds * 1000);
          const step = (now) => {
            const progress = clamp((now - startedAt) / duration, 0, 1);
            const value = from + (to - from) * progress;
            setEntryVolume(entry, value, true);
            if (progress < 1) {
              entry.fadeFrameId = requestAnimationFrame(step);
            }
          };
          entry.fadeFrameId = requestAnimationFrame(step);
          return;
        }

        if (!ctx) return;
        const now = ctx.currentTime;
        const fromValue = from <= SILENT_MEDIA_VOLUME ? 0 : Math.max(from, 0.0001);
        const toValue = to <= SILENT_MEDIA_VOLUME ? 0 : Math.max(to, 0.0001);
        debugAudio("fade", { id: entry.id, from, to, fromValue, toValue, direct: Boolean(entry.graph.direct) });
        entry.gain.gain.cancelScheduledValues(now);
        entry.gain.gain.setValueAtTime(fromValue, now);
        entry.gain.gain.linearRampToValueAtTime(toValue, now + seconds);
        entry.currentVolume = to;
      }

      function setEntryVolume(entry, volume) {
        entry.currentVolume = clamp(volume, 0, 1);
        if (entry.graph.direct && typeof entry.graph.setVolume === "function") {
          entry.graph.setVolume(entry.currentVolume * clamp(state.masterVolume, 0, 1));
        } else if (entry.gain && ctx) {
          const value = entry.currentVolume <= SILENT_MEDIA_VOLUME ? 0 : Math.max(entry.currentVolume, 0.0001);
          debugAudio("set volume", { id: entry.id, slider: entry.currentVolume, gain: value });
          entry.gain.gain.setValueAtTime(value, ctx.currentTime);
        }
      }

      function safeDisconnect(node) {
        try {
          node.disconnect();
        } catch {
          // Some nodes may already be disconnected.
        }
      }

      function setSoundVolume(id, volume) {
        const sound = soundById.get(id);
        if (!sound) return;

        state.volumes[id] = clamp(volume, 0, 1);
        const entry = runtime.get(id);
        if (entry && !entry.stopping && ctx) {
          debugAudio("slider", { id, volume: state.volumes[id] });
          fadeEntryVolume(entry, entry.currentVolume ?? state.volumes[id], state.volumes[id], 0.08);
        }

        activePreset = null;
        syncSoundVolumeUi(id);
        persistState();
      }

      function getActiveIds() {
        return SOUNDS
          .map((sound) => sound.id)
          .filter((id) => {
            const entry = runtime.get(id);
            return entry && !entry.stopping;
          });
      }

      function isSoundActive(id) {
        const entry = runtime.get(id);
        return Boolean(entry && !entry.stopping);
      }

      function updateLastMixFromActive() {
        const activeIds = getActiveIds();
        if (activeIds.length) {
          state.lastMix = activeIds;
        }
      }

      function normalizeMixIds(ids) {
        const filtered = (Array.isArray(ids) ? ids : [])
          .filter((id) => soundById.has(id));
        return filtered.length ? [...new Set(filtered)] : ["rain", "pink"];
      }

      function renderSoundGrid() {
        el.soundGrid.innerHTML = SOUNDS.map((sound) => {
          const isActive = isSoundActive(sound.id);
          const volume = Math.round((state.volumes[sound.id] ?? sound.defaultVolume) * 100);
          return `
            <button class="sound-card${isActive ? " is-active" : ""}" type="button" data-sound-id="${sound.id}" aria-pressed="${isActive}">
              <span class="sound-icon" aria-hidden="true">${escapeHtml(sound.icon)}</span>
              <span class="sound-copy">
                <span class="sound-label">${escapeHtml(sound.label)}</span>
                <span class="sound-meta">
                  <span>${escapeHtml(sound.tone)}</span>
                  <span data-card-level="${sound.id}">${volume}%</span>
                </span>
              </span>
            </button>
          `;
        }).join("");
      }

      function renderMixer() {
        const activeIds = getActiveIds();
        if (!activeIds.length) {
          el.mixerList.innerHTML = `<div class="empty-state">未選択</div>`;
          syncPlaybackUi();
          return;
        }

        el.mixerList.innerHTML = activeIds.map((id) => {
          const sound = soundById.get(id);
          const volume = Math.round((state.volumes[id] ?? sound.defaultVolume) * 100);
          return `
            <div class="mix-row" data-mix-row="${id}">
              <div class="mix-name">
                <span aria-hidden="true">${escapeHtml(sound.icon)}</span>
                <span>${escapeHtml(sound.label)}</span>
              </div>
              <input class="range" type="range" min="0" max="100" value="${volume}" data-volume-id="${id}" aria-label="${escapeHtml(sound.label)}の音量">
              <span class="percent" data-volume-output="${id}">${volume}%</span>
              <button class="icon-button" type="button" data-stop-id="${id}" aria-label="${escapeHtml(sound.label)}を停止">×</button>
            </div>
          `;
        }).join("");

        activeIds.forEach(syncSoundVolumeUi);
        syncPlaybackUi();
      }

      function renderPresetGrid() {
        const items = Object.entries(PRESETS).map(([id, preset]) => ({ id, ...preset }));
        if (state.customPreset) {
          items.push({ id: "custom", ...state.customPreset });
        }

        el.presetGrid.innerHTML = items.map((preset) => `
          <button class="preset-button${activePreset === preset.id ? " is-active" : ""}" type="button" data-preset-id="${preset.id}">
            <span aria-hidden="true">${preset.icon}</span>
            <strong>${preset.label}</strong>
          </button>
        `).join("");

        setSaveStatus(state.customPreset ? "保存済み" : "未保存");
      }

      function renderExternalTemplates() {
        el.externalTemplates.innerHTML = Object.entries(EXTERNAL_TEMPLATES).map(([id, template]) => `
          <button class="template-button${isExternalTemplateActive(id) ? " is-active" : ""}" type="button" data-external-template="${id}">
            <span aria-hidden="true">${escapeHtml(template.icon)}</span>
            <span>${escapeHtml(template.buttonLabel || `${template.label} Radio`)}</span>
          </button>
        `).join("");
      }

      function isExternalTemplateActive(key) {
        return SOUNDS.some((sound) => {
          const entry = runtime.get(sound.id);
          return sound.templateKey === key && entry && !entry.stopping;
        });
      }

      function syncMasterUi() {
        const percent = Math.round(clamp(state.masterVolume, 0, 1) * 100);
        el.masterVolume.value = String(percent);
        el.masterPercent.textContent = `${percent}%`;
        setRangeFill(el.masterVolume, percent);
        applyMasterGain();
        runtime.forEach((entry) => {
          if (entry.graph.direct && !entry.stopping) {
            setEntryVolume(entry, state.volumes[entry.id] ?? 0.45, true);
          }
        });
      }

      function syncSoundVolumeUi(id) {
        const sound = soundById.get(id);
        if (!sound) return;
        const percent = Math.round((state.volumes[id] ?? sound.defaultVolume) * 100);

        document.querySelectorAll(`[data-volume-id="${id}"]`).forEach((input) => {
          input.value = String(percent);
          setRangeFill(input, percent);
        });
        document.querySelectorAll(`[data-volume-output="${id}"], [data-card-level="${id}"]`).forEach((node) => {
          node.textContent = `${percent}%`;
        });
      }

      function syncPlaybackUi() {
        const activeIds = getActiveIds();
        const activeCount = activeIds.length;
        el.activeCount.textContent = `${activeCount} layer`;
        el.playAllIcon.textContent = activeCount ? "■" : "▶";
        el.playAllLabel.textContent = activeCount ? "停止" : "再生";
        el.meterDot.classList.toggle("is-live", activeCount > 0);

        if (!activeCount) {
          el.nowPlaying.textContent = "未再生";
          return;
        }

        el.nowPlaying.textContent = activeIds
          .map((id) => soundById.get(id).label)
          .join(" + ");
      }

      function setStatus(text) {
        el.statusText.textContent = text;
      }

      function setSaveStatus(text) {
        el.saveStatus.textContent = text;
      }

      function setExternalStatus(text) {
        el.externalStatus.textContent = text;
      }

      function setRangeFill(input, percent) {
        input.style.setProperty("--value", `${clamp(percent, 0, 100)}%`);
      }

      function setTimerMinutes(minutes) {
        const safeMinutes = clamp(Math.round(minutes), 1, 180);
        state.timerMinutes = safeMinutes;
        timer.duration = safeMinutes * 60;
        timer.remaining = timer.duration;
        stopTimerInterval();
        timer.running = false;
        persistState();
        syncTimerUi();
      }

      function toggleTimer() {
        if (timer.running) {
          pauseTimer();
        } else {
          startTimer();
        }
      }

      function startTimer() {
        if (timer.remaining <= 0) {
          timer.remaining = timer.duration;
        }
        timer.running = true;
        timer.endAt = Date.now() + timer.remaining * 1000;
        stopTimerInterval();
        timer.intervalId = window.setInterval(tickTimer, 250);
        tickTimer();
      }

      function pauseTimer() {
        if (timer.running) {
          timer.remaining = Math.max(0, Math.ceil((timer.endAt - Date.now()) / 1000));
        }
        timer.running = false;
        stopTimerInterval();
        syncTimerUi();
      }

      function resetTimer() {
        timer.running = false;
        timer.remaining = timer.duration;
        stopTimerInterval();
        syncTimerUi();
      }

      function tickTimer() {
        timer.remaining = Math.max(0, Math.ceil((timer.endAt - Date.now()) / 1000));
        if (timer.remaining <= 0) {
          timer.running = false;
          stopTimerInterval();
          stopAll({ remember: true });
          setStatus("タイマー終了");
        }
        syncTimerUi();
      }

      function stopTimerInterval() {
        clearInterval(timer.intervalId);
        timer.intervalId = 0;
      }

      function syncTimerUi() {
        const minutes = Math.floor(timer.remaining / 60);
        const seconds = timer.remaining % 60;
        el.timeValue.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
        el.timerState.textContent = timer.running ? "進行中" : "待機中";
        el.timerToggle.textContent = timer.running ? "一時停止" : "開始";
        el.customMinutes.value = String(state.timerMinutes);

        document.querySelectorAll("[data-minutes]").forEach((button) => {
          button.classList.toggle("is-active", Number(button.dataset.minutes) === state.timerMinutes);
        });
      }

      function resizeVisualizer() {
        const rect = el.visualizer.getBoundingClientRect();
        const scale = window.devicePixelRatio || 1;
        const width = Math.max(1, Math.floor(rect.width * scale));
        const height = Math.max(1, Math.floor(rect.height * scale));
        if (el.visualizer.width !== width || el.visualizer.height !== height) {
          el.visualizer.width = width;
          el.visualizer.height = height;
        }
      }

      function drawVisualizer() {
        rafId = window.requestAnimationFrame(drawVisualizer);
        if (!canvasContext) return;

        const canvas = el.visualizer;
        const dpr = window.devicePixelRatio || 1;
        const width = canvas.width / dpr;
        const height = canvas.height / dpr;
        const now = performance.now() / 1000;
        const activeIds = getActiveIds();

        canvasContext.save();
        canvasContext.setTransform(dpr, 0, 0, dpr, 0, 0);
        canvasContext.clearRect(0, 0, width, height);

        const bg = canvasContext.createLinearGradient(0, 0, width, height);
        bg.addColorStop(0, "rgba(4, 10, 15, 0.42)");
        bg.addColorStop(0.52, "rgba(15, 28, 34, 0.22)");
        bg.addColorStop(1, "rgba(10, 9, 8, 0.18)");
        canvasContext.fillStyle = bg;
        canvasContext.fillRect(0, 0, width, height);

        let bins = null;
        if (analyser && activeIds.length && frequencyData) {
          analyser.getByteFrequencyData(frequencyData);
          bins = frequencyData;
        }

        drawWaveField(canvasContext, width, height, now, bins, activeIds.length);
        drawBars(canvasContext, width, height, now, bins, activeIds.length);
        canvasContext.restore();
      }

      function drawWaveField(context, width, height, now, bins, activeCount) {
        const lineCount = 4;
        for (let row = 0; row < lineCount; row += 1) {
          const yBase = height * (0.32 + row * 0.12);
          const amplitude = activeCount ? 9 + row * 4 : 5 + row * 2;
          const hue = row % 2 === 0 ? "60, 224, 195" : "255, 180, 79";
          context.beginPath();
          for (let x = 0; x <= width; x += 10) {
            const idx = bins ? Math.floor((x / width) * (bins.length - 1)) : 0;
            const energy = bins ? bins[idx] / 255 : 0.18 + Math.sin(now * 0.7 + row) * 0.06;
            const y = yBase
              + Math.sin((x * 0.018) + now * (0.6 + row * 0.15) + row) * amplitude
              + energy * (18 + row * 5);
            if (x === 0) {
              context.moveTo(x, y);
            } else {
              context.lineTo(x, y);
            }
          }
          context.strokeStyle = `rgba(${hue}, ${activeCount ? 0.32 : 0.16})`;
          context.lineWidth = 1.4;
          context.stroke();
        }
      }

      function drawBars(context, width, height, now, bins, activeCount) {
        const count = Math.max(28, Math.floor(width / 18));
        const gap = 6;
        const barWidth = Math.max(4, (width - gap * (count - 1)) / count);
        const baseY = height - 24;
        for (let i = 0; i < count; i += 1) {
          const x = i * (barWidth + gap);
          const idx = bins ? Math.min(bins.length - 1, Math.floor((i / count) * bins.length)) : 0;
          const idle = 0.16 + Math.sin(now * 1.6 + i * 0.45) * 0.06;
          const energy = bins ? bins[idx] / 255 : idle;
          const barHeight = 10 + energy * (activeCount ? 88 : 34);
          const gradient = context.createLinearGradient(0, baseY - barHeight, 0, baseY);
          gradient.addColorStop(0, activeCount ? "rgba(255, 180, 79, 0.72)" : "rgba(255, 180, 79, 0.22)");
          gradient.addColorStop(1, activeCount ? "rgba(60, 224, 195, 0.58)" : "rgba(60, 224, 195, 0.2)");
          context.fillStyle = gradient;
          context.fillRect(x, baseY - barHeight, barWidth, barHeight);
        }
      }

      function singleSourceGraph(source) {
        return {
          output: source,
          sources: [source],
          nodes: []
        };
      }

      async function createFetchAudioGraph(audio, url, loop) {
        let buffer = bufferCache.get(url);
        if (!buffer) {
          const response = await fetch(url);
          const arrayBuffer = await response.arrayBuffer();
          buffer = await audio.decodeAudioData(arrayBuffer);
          bufferCache.set(url, buffer);
        }

        const source = audio.createBufferSource();
        source.buffer = buffer;
        source.loop = loop;

        const output = audio.createGain();
        output.gain.value = 1;
        source.connect(output);

        return {
          output,
          sources: [source],
          nodes: [output],
          debugSnapshot() {
            return { url, mode: "fetch-buffer", loop };
          },
          async start() {
            try { source.start(0); } catch (_) {}
          },
          stop() {
            try { source.stop(); } catch (_) {}
          }
        };
      }

      function createExternalMediaGraph(audio, url, loop) {
        const media = new Audio();

        if (!url.startsWith("blob:")) {
          media.crossOrigin = "anonymous";
        }
        media.src = url;
        media.loop = loop;
        media.preload = loop ? "auto" : "none";
        media.playsInline = true;
        media.volume = 1;
        media.addEventListener("error", () => {
          debugAudio("media error", {
            url,
            code: media.error ? media.error.code : 0,
            message: media.error ? media.error.message : ""
          });
        });
        media.addEventListener("volumechange", () => {
          debugAudio("media volumechange", {
            volume: media.volume,
            muted: media.muted
          });
        });

        const output = audio.createGain();
        const graphSources = [];
        output.gain.value = 1;
        debugAudio("external graph", { url, mode: "media-element-source", crossOrigin: media.crossOrigin || "none" });

        return {
          output,
          sources: graphSources,
          nodes: [output],
          media,
          objectUrl: url.startsWith("blob:") ? url : "",
          debugSnapshot() {
            return {
              url,
              mode: "media-element-source",
              paused: media.paused,
              muted: media.muted,
              mediaVolume: media.volume,
              readyState: media.readyState,
              networkState: media.networkState,
              outputGain: output.gain.value,
              crossOrigin: media.crossOrigin || "none"
            };
          },
          async start() {
            debugAudio("media play", { url });
            await media.play();
            let source;
            if (typeof media.captureStream === "function") {
              try {
                const stream = media.captureStream();
                if (stream.getAudioTracks().length > 0) {
                  source = audio.createMediaStreamSource(stream);
                }
              } catch (_) {}
            }
            if (!source) {
              source = audio.createMediaElementSource(media);
            }
            source.connect(output);
            graphSources.push(source);
          },
          stop() {
            media.pause();
            media.removeAttribute("src");
            media.load();
          }
        };
      }

      function createWhiteNoise(audio) {
        const buffer = createNoiseBuffer(audio, 4, (sample) => sample);
        return loopingSource(audio, buffer);
      }

      function createBabyWhiteNoise(audio) {
        const source = createWhiteNoise(audio);
        const lowpass = audio.createBiquadFilter();
        lowpass.type = "lowpass";
        lowpass.frequency.value = 2200;
        lowpass.Q.value = 0.35;

        const highpass = audio.createBiquadFilter();
        highpass.type = "highpass";
        highpass.frequency.value = 90;
        highpass.Q.value = 0.45;

        const output = audio.createGain();
        output.gain.value = 0.72;

        source.connect(lowpass);
        lowpass.connect(highpass);
        highpass.connect(output);

        return {
          output,
          sources: [source],
          nodes: [lowpass, highpass, output]
        };
      }

      function createPinkNoise(audio) {
        let b0 = 0;
        let b1 = 0;
        let b2 = 0;
        let b3 = 0;
        let b4 = 0;
        let b5 = 0;
        let b6 = 0;
        const buffer = createNoiseBuffer(audio, 4, (white) => {
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.969 * b2 + white * 0.153852;
          b3 = 0.8665 * b3 + white * 0.3104856;
          b4 = 0.55 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.016898;
          const pink = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) / 7;
          b6 = white * 0.115926;
          return pink;
        });
        return loopingSource(audio, buffer);
      }

      function createBrownNoise(audio) {
        let lastOut = 0;
        const buffer = createNoiseBuffer(audio, 4, (white) => {
          lastOut = (lastOut + 0.02 * white) / 1.02;
          return lastOut * 3.5;
        });
        return loopingSource(audio, buffer);
      }

      function createRainNoise(audio) {
        const bed = createPinkNoise(audio);
        const drops = loopingSource(audio, createSparseCrackleBuffer(audio, 4, {
          density: 54,
          decayMin: 0.002,
          decayMax: 0.018,
          gainMin: 0.08,
          gainMax: 0.32
        }));

        const highpass = audio.createBiquadFilter();
        highpass.type = "highpass";
        highpass.frequency.value = 620;

        const lowpass = audio.createBiquadFilter();
        lowpass.type = "lowpass";
        lowpass.frequency.value = 6200;

        const dropFilter = audio.createBiquadFilter();
        dropFilter.type = "bandpass";
        dropFilter.frequency.value = 2600;
        dropFilter.Q.value = 0.8;

        const bedGain = audio.createGain();
        bedGain.gain.value = 0.62;
        const dropGain = audio.createGain();
        dropGain.gain.value = 0.38;
        const output = audio.createGain();
        output.gain.value = 0.9;

        bed.connect(highpass);
        highpass.connect(lowpass);
        lowpass.connect(bedGain);
        bedGain.connect(output);
        drops.connect(dropFilter);
        dropFilter.connect(dropGain);
        dropGain.connect(output);

        return {
          output,
          sources: [bed, drops],
          nodes: [highpass, lowpass, dropFilter, bedGain, dropGain, output]
        };
      }

      function createWindNoise(audio) {
        const wind = createBrownNoise(audio);
        const filter = audio.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 520;
        filter.Q.value = 0.56;

        const shaper = audio.createWaveShaper();
        shaper.curve = softSaturationCurve(220);
        shaper.oversample = "2x";

        const output = audio.createGain();
        output.gain.value = 0.52;

        const freqLfo = audio.createOscillator();
        freqLfo.type = "sine";
        freqLfo.frequency.value = 0.08;
        const freqDepth = audio.createGain();
        freqDepth.gain.value = 260;

        const ampLfo = audio.createOscillator();
        ampLfo.type = "sine";
        ampLfo.frequency.value = 0.13;
        const ampDepth = audio.createGain();
        ampDepth.gain.value = 0.18;

        wind.connect(filter);
        filter.connect(shaper);
        shaper.connect(output);
        freqLfo.connect(freqDepth);
        freqDepth.connect(filter.frequency);
        ampLfo.connect(ampDepth);
        ampDepth.connect(output.gain);

        return {
          output,
          sources: [wind, freqLfo, ampLfo],
          nodes: [filter, shaper, output, freqDepth, ampDepth]
        };
      }

      function createWaveNoise(audio) {
        const swell = createBrownNoise(audio);
        const foam = createPinkNoise(audio);
        const lowpass = audio.createBiquadFilter();
        lowpass.type = "lowpass";
        lowpass.frequency.value = 480;

        const foamFilter = audio.createBiquadFilter();
        foamFilter.type = "highpass";
        foamFilter.frequency.value = 1400;

        const swellGain = audio.createGain();
        swellGain.gain.value = 0.34;
        const foamGain = audio.createGain();
        foamGain.gain.value = 0.14;
        const output = audio.createGain();
        output.gain.value = 0.95;

        const lfo = audio.createOscillator();
        lfo.type = "sine";
        lfo.frequency.value = 0.085;
        const swellDepth = audio.createGain();
        swellDepth.gain.value = 0.28;
        const foamDepth = audio.createGain();
        foamDepth.gain.value = 0.08;

        swell.connect(lowpass);
        lowpass.connect(swellGain);
        swellGain.connect(output);
        foam.connect(foamFilter);
        foamFilter.connect(foamGain);
        foamGain.connect(output);
        lfo.connect(swellDepth);
        lfo.connect(foamDepth);
        swellDepth.connect(swellGain.gain);
        foamDepth.connect(foamGain.gain);

        return {
          output,
          sources: [swell, foam, lfo],
          nodes: [lowpass, foamFilter, swellGain, foamGain, output, swellDepth, foamDepth]
        };
      }

      function createFireNoise(audio) {
        const bed = createBrownNoise(audio);
        const crackle = loopingSource(audio, createSparseCrackleBuffer(audio, 4, {
          density: 12,
          decayMin: 0.004,
          decayMax: 0.038,
          gainMin: 0.18,
          gainMax: 0.86
        }));

        const bedFilter = audio.createBiquadFilter();
        bedFilter.type = "bandpass";
        bedFilter.frequency.value = 240;
        bedFilter.Q.value = 0.7;

        const crackleFilter = audio.createBiquadFilter();
        crackleFilter.type = "bandpass";
        crackleFilter.frequency.value = 3100;
        crackleFilter.Q.value = 1.2;

        const bedGain = audio.createGain();
        bedGain.gain.value = 0.16;
        const crackleGain = audio.createGain();
        crackleGain.gain.value = 0.72;
        const output = audio.createGain();
        output.gain.value = 0.88;

        bed.connect(bedFilter);
        bedFilter.connect(bedGain);
        bedGain.connect(output);
        crackle.connect(crackleFilter);
        crackleFilter.connect(crackleGain);
        crackleGain.connect(output);

        return {
          output,
          sources: [bed, crackle],
          nodes: [bedFilter, crackleFilter, bedGain, crackleGain, output]
        };
      }

      function createNoiseBuffer(audio, seconds, transform) {
        const length = Math.floor(audio.sampleRate * seconds);
        const buffer = audio.createBuffer(1, length, audio.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i += 1) {
          const white = Math.random() * 2 - 1;
          data[i] = clamp(transform(white, i), -1, 1);
        }
        return buffer;
      }

      function createSparseCrackleBuffer(audio, seconds, options) {
        const length = Math.floor(audio.sampleRate * seconds);
        const buffer = audio.createBuffer(1, length, audio.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i += 1) {
          if (Math.random() < options.density / audio.sampleRate) {
            const decay = Math.floor(audio.sampleRate * randomBetween(options.decayMin, options.decayMax));
            const gain = randomBetween(options.gainMin, options.gainMax);
            for (let j = 0; j < decay && i + j < length; j += 1) {
              const envelope = Math.pow(1 - (j / decay), 2);
              data[i + j] += (Math.random() * 2 - 1) * gain * envelope;
            }
          }
          data[i] = clamp(data[i], -1, 1);
        }
        return buffer;
      }

      function loopingSource(audio, buffer) {
        const source = audio.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        return source;
      }

      function softSaturationCurve(amount) {
        const samples = 44100;
        const curve = new Float32Array(samples);
        const deg = Math.PI / 180;
        for (let i = 0; i < samples; i += 1) {
          const x = (i * 2) / samples - 1;
          curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
        }
        return curve;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function randomBetween(min, max) {
        return min + Math.random() * (max - min);
      }

      function initAudioDebug() {
        if (!AUDIO_DEBUG) return;
        audioDebugEl = document.createElement("section");
        audioDebugEl.className = "audio-debug";
        audioDebugEl.setAttribute("aria-live", "polite");
        document.body.appendChild(audioDebugEl);
        debugAudio("debug ready", {
          userAgent: navigator.userAgent,
          protocol: window.location.protocol,
          hash: window.location.hash
        });
        audioDebugTimerId = window.setInterval(renderAudioDebug, 700);
        renderAudioDebug();
      }

      function debugAudio(label, data = {}) {
        if (!AUDIO_DEBUG) return;
        audioDebugEvents.unshift({
          at: new Date().toLocaleTimeString(),
          label,
          data
        });
        audioDebugEvents.length = Math.min(audioDebugEvents.length, 10);
        renderAudioDebug();
      }

      function renderAudioDebug() {
        if (!audioDebugEl) return;
        const active = getActiveIds().map((id) => {
          const entry = runtime.get(id);
          const sound = soundById.get(id);
          const graph = entry && entry.graph;
          const debug = graph && typeof graph.debugSnapshot === "function" ? graph.debugSnapshot() : {};
          return {
            id,
            label: sound ? sound.label : id,
            slider: state.volumes[id],
            current: entry ? entry.currentVolume : null,
            gain: entry && entry.gain && entry.gain.gain ? entry.gain.gain.value : null,
            direct: graph ? Boolean(graph.direct) : null,
            ...debug
          };
        });
        const payload = {
          ctx: ctx ? ctx.state : "none",
          master: state.masterVolume,
          active,
          events: audioDebugEvents
        };
        audioDebugEl.innerHTML = `<strong>Audio debug</strong><pre>${escapeHtml(JSON.stringify(payload, null, 2))}</pre>`;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      window.addEventListener("beforeunload", () => {
        cancelAnimationFrame(rafId);
        clearInterval(audioDebugTimerId);
        stopTimerInterval();
      });
    })();
  </script>
</body>
